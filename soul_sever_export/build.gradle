plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.21'
}

group = 'com.lydiath.soulsever'
version = '1.0.0'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.0'
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java { srcDir 'src/main/java' }
        resources { srcDir 'src/main/resources' }
    }
}
